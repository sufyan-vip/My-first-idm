# ===========================================================================
#  Internet Download Manager – CI / build pipeline
#
#  • Runs the full test suite (offscreen Qt) on every push / PR.
#  • Builds the Windows .exe with PyInstaller (onefile, windowed).
#  • Installs NSIS (absent from the windows-2025 image behind
#    `windows-latest`) and wraps the exe in an installer.
#  • Uploads the artifacts to the run, and – when a `v*` tag is pushed –
#    publishes them as a GitHub Release.
# ===========================================================================

name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: Test (Windows, offscreen Qt)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest tests -v

  # ------------------------------------------------------------------ build
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        # --distpath/--workpath keep the output under build/dist, where
        # installer.nsi, the zip step and the artifact uploads expect it
        # (PyInstaller's defaults would put it in ./dist at the repo root).
        run: pyinstaller idm.spec --noconfirm --distpath build/dist --workpath build/pyi_build

      # `windows-latest` is the windows-2025 image, which does NOT ship NSIS
      # (only windows-2022 preinstalls NSIS 3.10). Install it with the
      # Chocolatey that is already on the runner.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install NSIS (exit $LASTEXITCODE)" }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) { throw "makensis not found after NSIS install" }
          & $makensis /VERSION
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build NSIS installer
        shell: pwsh
        # quoted: a leading '&' would otherwise be parsed as a YAML anchor
        run: "& $env:MAKENSIS build/installer.nsi"

      - name: Package portable exe (zip)
        shell: pwsh
        run: Compress-Archive -Path "build/dist/InternetDownloadManager.exe" -DestinationPath "build/dist/InternetDownloadManager-portable.zip" -Force

      # Wildcards are fragile in artifact paths and `gh` would receive the
      # literal '*' – give the installer one fixed, stable name.
      - name: Normalize installer name
        shell: pwsh
        run: |
          $setup = Get-ChildItem "build/dist/InternetDownloadManager-Setup-*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer was not produced in build/dist" }
          Copy-Item $setup.FullName "build/dist/InternetDownloadManager-Setup.exe" -Force
          Write-Host "Installer: $($setup.Name) -> InternetDownloadManager-Setup.exe"

      - name: Upload portable EXE
        uses: actions/upload-artifact@v7
        with:
          name: InternetDownloadManager-windows
          path: build/dist/InternetDownloadManager.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: InternetDownloadManager-setup
          path: build/dist/InternetDownloadManager-Setup.exe
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: InternetDownloadManager-portable
          path: build/dist/InternetDownloadManager-portable.zip
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Publish Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download portable EXE
        uses: actions/download-artifact@v8
        with:
          name: InternetDownloadManager-windows
          path: release

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: InternetDownloadManager-setup
          path: release

      - name: Download portable zip
        uses: actions/download-artifact@v8
        with:
          name: InternetDownloadManager-portable
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          gh release create $tag "release/InternetDownloadManager.exe" "release/InternetDownloadManager-Setup.exe" "release/InternetDownloadManager-portable.zip" --title "Internet Download Manager $version" --notes "Windows build - portable single exe, NSIS installer and portable zip." --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $tag" }
